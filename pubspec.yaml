name: mindreset_flutter
description: MindReset Flutter app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  health: ^13.3.1
  equatable: ^2.0.7

dev_dependencies:
