name: Supabase backup
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
      PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
      PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
      PGUSER: ${{ secrets.SUPABASE_DB_USER }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: |
          TS="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          echo "TS=$TS" >> "$GITHUB_ENV"
          mkdir -p $GITHUB_WORKSPACE/.backup
          pg_dump --schema-only --no-owner --no-privileges -f "$GITHUB_WORKSPACE/.backup/schema-${TS}.sql"
          pg_dump --data-only --no-owner --no-privileges --inserts -f "$GITHUB_WORKSPACE/.backup/data-${TS}.sql"
          gzip -f $GITHUB_WORKSPACE/.backup/schema-${TS}.sql $GITHUB_WORKSPACE/.backup/data-${TS}.sql
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.TS }}
          path: .backup/*.gz
          retention-days: 30
